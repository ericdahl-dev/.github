name: American spelling

# Org-wide check, required through the org ruleset: fails a PR whose repo contains British
# spellings (e.g. 'colour' for 'color'). Uses the public spelling-dialect action, so  # spelling: ok
# every repo runs the same released version. A repo can allow words (stored values, external API
# names) or skip paths in .spelling-dialect (or the older .american-spelling-allow).
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  spelling:
    # Private repos run on the org's ger3 runners (no hosted minutes); public repos can't use them.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","ger3"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ericdahl-dev/spelling-dialect@v1
        with:
          dialect: american
